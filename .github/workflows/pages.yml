name: Site
run-name: Publish site/ to GitHub Pages

# S0008 and S0012: site/ holds the hand-authored privacy pages and the landing in three locales, rendered by
# tools/site/render-landing.ps1 and committed. This workflow publishes site/ as it is, and refuses to unless the landing
# equals its sources (and, since S0024, the help pages under site/help/ equal theirs). The check runs on Windows, where the renderer is measured; the deploy runs on Linux.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/site/**'
      - 'tools/help/**'
      - 'phone/src/main/assets/help/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: windows-latest
    steps:
      # The pages and their sources are LF in the repository and the check compares bytes; the Windows runner's default
      # core.autocrlf=true would turn them into CRLF on checkout.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Landing pages equal their sources
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/site/render-landing.ps1 -Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # S0024: site/help/ is rendered from the same sources as the pages bundled in the app; the gate also holds the
      # app's copy and the site's copy byte for byte equal.
      - name: Help pages equal their sources
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/help/check-help-map.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
