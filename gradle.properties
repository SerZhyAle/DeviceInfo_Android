# Toolchain JDK: build with a JDK 17, 21 or 25 install (the Gradle 9.4.1 / AGP 9.2.1 pair does not run on
# JDK 26). org.gradle.java.home is deliberately NOT set here: it is a machine-specific absolute path.
# Set it per developer in %USERPROFILE%\.gradle\gradle.properties.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
kotlin.code.style=official
kotlin.incremental=true

# KSP (the Hilt compiler) still wires generated sources through kotlin.sourceSets under AGP's built-in Kotlin.
# Keep this override until the KSP plugin switches to AndroidSourceSet.kotlin.
android.disallowKotlinSourceSets=false

# KSP2 crashes with "this and base files have different roots" when the Gradle cache and the project sit on
# different Windows drives (here C:\Users\..\.gradle against P:\..). It dies before any Kotlin of the module
# compiles. Inert on a single-root layout; drop it once KSP fixes the path computation upstream. Same defect
# and same remedy as Tourist_mob, FastMediaSorter and StreamsPlayer.
ksp.incremental=false

# 16 KB page size support (mandatory for Google Play since 2025-11-01).
android.bundle.enableNativeLibraryAlignment=true

# FROZEN application id, shared by the phone and the watch app (owner decision of S0008, 2026-11-13). The
# Wear OS Data Layer routes by (package name, signing certificate) and silently drops a message whose package
# name differs across the two devices, so the id is declared once, here, and both modules read it: they cannot
# diverge. It has been a frozen anchor since the Play Console app was created with it (2026-11-13): the create-app
# form binds the package name to the account that day, so it is never changed. Never an applicationIdSuffix on any
# build type.
deviceinfo.applicationId=com.sza.deviceinfo

# NON-RELEASABLE version sentinels (PACKAGE-VERSIONING, Android profile, rules 6 and 7): the instant
# 2611100000 (2026-11-10 00:00) rendered by rules 2 and 3. They mark a build nobody stamped and never leave
# the developer's devices. Phone owns band 0..5 of the last code digit, the watch app band 6..9, so the two
# packages sharing one application id never repeat a code. A debug invocation carries them; an invocation
# that builds a release variant stamps itself from one clock reading, or takes the pin below (buildSrc
# `VersionStamp`, fixed-instant vectors in `VersionStampTest`); tools/release/check-version-parity.ps1 is the
# parity gate that refuses a drifted pair (rule 8).
#
# The release pin (rule 5) is three properties passed together or not at all, one invocation for both
# packages: -Pdeviceinfo.pin.versionName=Y.YM.MDDH.Hmm -Pdeviceinfo.pin.versionCode.phone=N
# -Pdeviceinfo.pin.versionCode.wear=N. A pin that does not describe one instant of each family's partition
# stops the build.
deviceinfo.sentinel.versionName=2.61.1100.000
deviceinfo.sentinel.versionCode.phone=261110000
deviceinfo.sentinel.versionCode.wear=261110006
